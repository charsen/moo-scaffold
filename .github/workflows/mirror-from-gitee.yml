name: Mirror from Gitee

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: mirror-from-gitee
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository_owner == 'charsen'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror Gitee repository to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          for attempt in 1 2 3; do
            rm -rf "$workdir/repo.git"
            if GIT_TERMINAL_PROMPT=0 git clone --mirror \
              "https://gitee.com/charsen/${REPO}.git" "$workdir/repo.git"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Gitee clone failed after 3 attempts" >&2
              exit 1
            fi

            sleep $((attempt * 20))
          done

          cd "$workdir/repo.git"

          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' \
            push --mirror "https://github.com/${GITHUB_REPOSITORY}.git"
