#
# Scaffold 开发人员账号模板（plan 18）
#
# 用法：首次运行 `php artisan moo:account:add` 会从此模板初始化 scaffold/accounts.yaml；
#       后续由 scaffold UI / CLI 维护。
# 注意：accounts.yaml 跟随 git（团队 + 远程部署同步），密码以 bcrypt hash 存储。
#       本模板入 git，请勿写入真实密码。

meta:
    schema_version: 1
    updated_at: ''
    updated_by: ''
    source: stub                  # stub | scaffold-ui | cli
    count: 0

accounts:
    # 示例：一个普通 admin（首次启动用，登录后请立即改密）
    # password 一栏是**占位符**，不是可用口令 —— 仅示意「这里是明文，store 首次写入时
    # 会自动 bcrypt 化」。请勿照抄，也请勿在本文件里写任何真实密码（本文件入 git、
    # 随包发布；真实账号走 scaffold/accounts.yaml，那份不入本模板）。
    - username: admin
      password: 'change-me'
      phone: ''
      role: admin                 # admin | member
      enabled: true
      created_at: ''
      updated_at: ''
